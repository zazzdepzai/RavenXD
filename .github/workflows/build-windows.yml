name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtnetworkauth'

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Deploy Qt DLLs (windeployqt)
        run: |
          cd build
          windeployqt.exe Release\RavenXDLauncher.exe --release --no-translations
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavenXDLauncher-windows
          path: build/Release/
